<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>aura-ui-router</title>
</head>
<body>

<nav style=" display: flex; gap:20px; margin:30px">
  <a href="/a" data-router-link>link html</a>
  <a href="/b" data-router-link>link html-src</a>
  <a href="/c" data-router-link>link template</a>
  <a href="/d" data-router-link>link component-src 1 (error)</a>
  <a href="/f" data-router-link>link component-src 2</a>
  <a href="/users" data-router-link>Users (html-src)</a>
  <a href="/about.html">About</a>
</nav>

<template id="app">Шаблон</template>
<template id="loading-template">Загрузка, ожидаем</template>
<template id="error-template">Ой что-то пошло не так, попробуйте позже</template>

<aura-router error-template="error-template"
             loading-template="loading-template">
  <aura-route path="/a" source="html" data-content='<a href="/c" data-router-link>load template</a>'></aura-route>
  <aura-route path="/b" source="html-src" data-content="index2.html" preload></aura-route>
  <aura-route path="/c" source="template" data-content="app"></aura-route>
  <aura-route path="/d" source="component-src" data-content='components/test-element1'></aura-route>
  <aura-route path="/f" source="component-src" data-content='components/test-element' preserve-state></aura-route>
  <aura-route path="/users" source="html-src" data-content="user.html"></aura-route>
  <aura-route path="/user/:id" soure="component-src" data-content='components/test-element' preload></aura-route>
</aura-router>

<!--<aura-route path="/b" loader='html-src' content="index2.html" preload></aura-route>-->
<!--<aura-route path="/b" loader-type='html-src' content="index2.html" preload></aura-route>-->
<!--<aura-route path="/b" type='html-src' content="index2.html" preload></aura-route>-->
<!--

<aura-route path="/c" source="template:app"></aura-route>
<aura-route path="/b" source="html-src:index2.html"></aura-route>
<aura-route path="/d" source="component-src:components/test-element"></aura-route>
-->

<!--source="<тип>:<значение>"-->

<script type="module" src="/src/main.ts"></script>

</body>
</html>
