<!doctype html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Вне SPA — Aura Router</title>
  <style>
    body {
      margin: 0; min-height: 100vh; font-family: "Segoe UI", system-ui, sans-serif;
      display: grid; place-items: center; padding: 2rem;
      background: linear-gradient(160deg, #eceef4, #edf2ff); color: #12151c;
    }
    .card {
      max-width: 26rem; text-align: center; padding: 2rem;
      background: #fff; border: 1px solid #dde1ea; border-radius: 14px;
      box-shadow: 0 12px 32px rgb(18 21 28 / 8%);
    }
    h1 { margin: 0 0 0.5rem; font-size: 1.4rem; }
    p { margin: 0; color: #5f677a; line-height: 1.55; }
    a { display: inline-block; margin-top: 1.25rem; color: #4263eb; font-weight: 600; }
  </style>
</head>
<body>
  <div class="card">
    <h1>Полная перезагрузка</h1>
    <p>Эта страница загрузилась без SPA-роутера — обычный переход браузера (нет <code>data-router-link</code>).</p>
    <a href="/">← Вернуться в демо</a>
  </div>
</body>
</html>
