<!doctype html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Роутинг — Aura UI &gt; Router</title>
  <link rel="stylesheet" href="/demo.css" />
</head>
<body>
  <div class="shell">
    <div class="demo-page demo-site">
      <header class="demo-header">
        <span class="demo-header__brand">Aura UI &gt; Router</span>
        <a href="/" class="demo-header__back">← Оглавление</a>
      </header>

      <div class="demo-site-bar">
        <div class="demo-site-bar__url">
          <span class="demo-site-bar__label">URL</span>
          <code id="demo-site-url" aria-live="polite"></code>
        </div>
        <nav class="demo-links demo-site-nav" aria-label="Навигация мини-сайта">
          <a href="/features/routing" data-router-link>Обзор</a>
          <a href="/features/routing/a" data-router-link>Страница A</a>
          <a href="/features/routing/b" data-router-link>Страница B</a>
          <a href="/features/routing/users" data-router-link>Список</a>
          <a href="/features/routing/users/1" data-router-link>User 1</a>
          <a href="/features/routing/users/2" data-router-link>User 2</a>
          <a href="/features/routing/users/3" data-router-link>User 3</a>
        </nav>
      </div>

      <div class="demo-site-stage">
        <aura-router id="app">
          <aura-outlet class="demo-site-outlet"></aura-outlet>

          <aura-route path="/features/routing/index.html" view="features/routing/intro.html"></aura-route>
          <aura-route path="/features/routing" view="features/routing/intro.html"></aura-route>
          <aura-route path="/features/routing/a" view="features/routing/page-a.html"></aura-route>
          <aura-route path="/features/routing/b" view="features/routing/page-b.html"></aura-route>

          <aura-route path="/features/routing/users" layout="users-layout">
            <aura-route path="." view="features/routing/users-list.html"></aura-route>
            <aura-route path=":id" view="features/routing/user.html"></aura-route>
          </aura-route>
        </aura-router>
      </div>
    </div>
  </div>

  <template id="users-layout">
    <div data-nested-layout>
      <p class="demo-nested-label">Layout «Users» — общая оболочка, не перерисовывается при смене дочернего маршрута</p>
      <nav class="demo-links">
        <a href="/features/routing/users" data-router-link>Список</a>
        <a href="/features/routing/users/1" data-router-link>User 1</a>
        <a href="/features/routing/users/2" data-router-link>User 2</a>
        <a href="/features/routing/users/3" data-router-link>User 3</a>
      </nav>
      <hr />
      <aura-outlet></aura-outlet>
    </div>
  </template>

  <script type="module" src="/src/examples/demo/main.ts"></script>
</body>
</html>
