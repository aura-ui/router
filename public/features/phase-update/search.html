<article class="demo-site-view demo-layout-view" data-demo-view="features/phase-update/search.html">
  <h1>Search — query</h1>
  <p class="demo-site-view__lead">Pathname не меняется — обновляется только строка query (<code>?tab=…</code>). Роутер выполняет <code>runUpdate()</code>, а не полный цикл exit/enter.</p>

  <p>Активная вкладка: <code>tab=<span data-demo-param="tab">—</span></code></p>

  <nav class="demo-links">
    <a href="/features/phase-update/search?tab=info" data-aura-link>Информация</a>
    <a href="/features/phase-update/search?tab=posts" data-aura-link>Записи</a>
    <a href="/features/phase-update/search?tab=settings" data-aura-link>Настройки</a>
  </nav>

  <p class="demo-hint">Переключайте вкладки: меняется только query. «Назад» восстановит предыдущее значение <code>tab</code>.</p>

  <div class="demo-code-window">
    <div class="demo-code-window__bar">
      <span class="demo-code-window__dots" aria-hidden="true"><i></i><i></i><i></i></span>
      <span class="demo-code-window__lang">HTML</span>
    </div>
    <pre class="demo-code"><code class="language-html" data-code-from="phase-update-search-code"></code></pre>
  </div>
  <template id="phase-update-search-code">
<aura-route path="/features/phase-update/search" view="features/phase-update/search.html"></aura-route>

<a href="/features/phase-update/search?tab=info" data-aura-link>Информация</a>
<a href="/features/phase-update/search?tab=posts" data-aura-link>Записи</a>
  </template>
</article>
