<html lang="ru">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Diskora Atlas — плоский мир сказочных зверей</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
    href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&family=Source+Serif+4:opsz,wght@8..60,400;8..60,600&display=swap"
    rel="stylesheet"
  />
  <link rel="stylesheet" href="./static/main.css" />
  <script src="./static/main.js" defer></script>
</head>
<body>
  <header class="site-header">
    <a class="brand" href="/" aura-router-link>
      Diskora Atlas
      <span>Бестиарий диска, у которого есть край</span>
    </a>
    <nav class="top-nav">
      <a href="/" aura-router-link>Карта</a>
      <a href="/bestiary" aura-router-link>Бестиарий</a>
      <a href="/wall" aura-router-link>Стена</a>
      <a href="/seasons" aura-router-link>Сезоны</a>
      <a href="/about" aura-router-link>О мире</a>
      <a href="/start-journey" aura-router-link>Журнал</a>
    </nav>
  </header>

  <main class="shell">
    <aura-router
      link-active-class="active"
      loading-template="loading"
      loading-body-class="loading"
      error-template="error"
      cache-time="20000"
      cache
      prefetch="true"
    >
      <aura-route path="/" view="template::home-page"></aura-route>
      <aura-route path="/about" view="template::about-page"></aura-route>

      <aura-route
        path="/bestiary"
        view="bestiary"
        extract=".main"
        cache
      ></aura-route>
      <aura-route
        path="/bestiary/:id"
        view="bestiary/{{id}}"
        extract=".main"
      ></aura-route>

      <aura-route
        path="/regions/:regionId"
        layout="region-layout"
        ready="region-chrome"
        update="region-chrome"
      >
        <aura-route
          path="."
          view="regions/{{regionId}}"
          extract=".main"
        ></aura-route>
        <aura-route
          path="trails/:trailId"
          view="regions/{{regionId}}/trails/{{trailId}}"
          extract=".main"
        ></aura-route>
        <aura-route
          path="trails/:trailId/sights/:id"
          view="regions/{{regionId}}/trails/{{trailId}}/sights/{{id}}"
          extract=".main"
        ></aura-route>
        <aura-route
          path="journal"
          view="regions/{{regionId}}/journal"
          extract=".main"
          loading-template="loading-journal"
        ></aura-route>
      </aura-route>

      <aura-route path="/wall" view="wall" extract=".main"></aura-route>
      <aura-route
        path="/wall/gates/:gateId"
        view="wall/gates/{{gateId}}"
        extract=".main"
      ></aura-route>
      <aura-route
        path="/wall/beyond"
        view="wall/beyond"
        extract=".main"
        guard="journey"
      ></aura-route>

      <aura-route path="/start-journey" view="start-journey" extract=".main"></aura-route>
      <aura-route path="/seasons" view="seasons" extract=".main"></aura-route>

      <aura-route path="*" view="template::not-found"></aura-route>
    </aura-router>
  </main>

  <template id="home-page">
    <section class="disk-hero scroll-mark">
      <h1 class="hero-title">Земля — круглый стол</h1>
      <p class="lede" style="margin-inline: auto">
        За горизонтом не падают — упираются в Ледяную Стену.
        Внутри диска бродят сказочные звери. Атлас ведут странники и сказители.
      </p>

      <div class="disk-map" aria-label="Карта плоского мира">
        <a
          class="disk-sector is-soon"
          data-region="hearthlands"
          href="/regions/hearthlands"
          title="Скоро"
        >Срединные<br />Земли</a>
        <a
          class="disk-sector"
          data-region="whisperwood"
          href="/regions/whisperwood"
          aura-router-link
        >Шепчущий<br />Лес</a>
        <a
          class="disk-sector is-soon"
          data-region="sunsteppe"
          href="/regions/sunsteppe"
          title="Скоро"
        >Солнечная<br />Степь</a>
        <a
          class="disk-sector"
          data-region="mirrorsea"
          href="/regions/mirrorsea"
          aura-router-link
        >Зеркальное<br />Море</a>
        <a
          class="disk-sector"
          data-region="icewall"
          href="/regions/icewall"
          aura-router-link
        >Ледяная<br />Стена</a>
      </div>
      <p class="wall-ring-label">Белое кольцо по краю — Антарктида-обод</p>

      <div class="actions" style="justify-content: center">
        <a class="btn" href="/bestiary" aura-router-link>Открыть бестиарий</a>
        <a class="btn ghost" href="/wall" aura-router-link>К Стене</a>
      </div>
    </section>
  </template>

  <template id="about-page">
    <article class="panel scroll-mark">
      <h1>Как устроен диск</h1>
      <p class="lede">
        Это не спор о форме мира — это сказка в духе старых карт:
        «здесь водятся драконы», только добрее и с ободом изо льда.
      </p>
      <ul>
        <li><strong>Центр</strong> — Срединные Земли и знакомые поля.</li>
        <li><strong>Кольца</strong> — леса, моря, степи странников.</li>
        <li><strong>Край</strong> — Ледяная Стена (Антарктида как ограничивающее кольцо).</li>
      </ul>
      <p>
        Солнце ходит над столом. Карты кончаются у ворот Стены.
        За ними — только гул и многоточие.
      </p>
      <div class="actions">
        <a class="btn" href="/" aura-router-link>К карте</a>
        <a class="btn ghost" href="/start-journey" aura-router-link>Вписать имя в журнал</a>
      </div>
    </article>
  </template>

  <template id="region-layout">
    <section class="panel layout scroll-mark">
      <header class="region-chrome">
        <div>
          <p class="hint" style="margin: 0 0 4px">Регион диска · layout живёт при смене троп</p>
          <h1 class="region-name">Путешествие</h1>
        </div>
        <nav class="subnav" data-region-subnav>
          <a data-nav="overview" href=".">Обзор</a>
          <a data-nav="journal" href="journal">Дневник</a>
        </nav>
      </header>
      <aura-outlet></aura-outlet>
    </section>
  </template>

  <template id="loading">
    <div class="panel loading-panel">
      <h1>Сказитель листает свиток…</h1>
      <p>Подгружаем фрагмент карты</p>
    </div>
  </template>

  <template id="loading-journal">
    <div class="panel loading-panel">
      <h1>Открываем полевой дневник…</h1>
      <p>Чернила ещё сырые</p>
    </div>
  </template>

  <template id="error">
    <div class="panel error-panel">
      <h1>Свиток порвался</h1>
      <p>Не удалось загрузить страницу атласа.</p>
      <a class="btn" href="/" aura-router-link>На карту</a>
    </div>
  </template>

  <template id="not-found">
    <div class="panel not-found-panel">
      <h1>Край карты оборван</h1>
      <p>Зверь или тропа не записаны в атласе (path="*").</p>
      <a class="btn" href="/" aura-router-link>Вернуться к диску</a>
    </div>
  </template>

</body>
</html>
