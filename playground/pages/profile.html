<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>Profile</title>
  <link rel="stylesheet" href="./static/main.css" />
  <script src="./static/main.js" defer></script>
</head>
<body>
@header@
@nav@
<section class="layout" aura-router-ssr>
  <h2>Profile</h2>
  <p class="hint">requires login (guard="auth")</p>
  <div class="subnav">
    <a href="/profile" data-aura-link>Overview</a>
    <a href="/profile/settings" data-aura-link>Settings</a>
    <button type="button" data-demo-logout>Log out</button>
  </div>
  <aura-outlet>
    <div class="main" data-aura-view-root data-aura-key="/profile">
      <h1>Profile</h1>
      <p>Nested + <code>guard="auth"</code>. Shell uses <code>aura-router-ssr</code>; leaf is
        <code>extract=".main"</code>. Mismatched tree → hard reload without full adopt; the guard still runs. No
        session → redirect to /login.</p>
    </div>
  </aura-outlet>
</section>
@router@
</body>
</html>
