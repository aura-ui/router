<html lang="ru">
<head>
  <meta charset="utf-8" />
  <title>Книга странника</title>
</head>
<body>
  <div class="main">
    <article class="scroll-mark">
      <div class="callout" data-guard-banner hidden>
        <strong>Сначала запись в книге.</strong>
        Путь за Стену закрыт, пока странник не вписан. Вас вернули сюда.
      </div>
      <h1>Имя у порога</h1>
      <p class="lede">
        Стражи Стены не спрашивают паспорт — только, как вас зовут в атласе.
        Без имени путь за край сворачивает обратно к этой странице.
      </p>
      <form class="journey-form" data-journey-form>
        <label>
          Имя в книге
          <input name="name" type="text" placeholder="например, Иво Лесная" required maxlength="40" />
        </label>
        <button class="btn" type="submit">Вписать имя и подойти к краю</button>
      </form>
      <p class="hint" style="margin-top: 16px">
        Имя помнит только эта вкладка.
      </p>
      <div class="actions">
        <a class="btn ghost" href="/wall" aura-router-link>К заставам</a>
      </div>
    </article>
  </div>
</body>
</html>
