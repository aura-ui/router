<!doctype html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Update shortcut — Aura UI - Router</title>
  <link rel="stylesheet" href="/demo.css" />
</head>
<body>
  <div class="shell">
    <div class="demo-page demo-site" data-demo-scenario="phase-update">
      <header class="demo-header">
        <div class="demo-header__brand">
          <span class="demo-header__title">Aura UI</span>
          <code class="demo-header__tag">&lt;aura-router&gt;</code>
        </div>
        <a href="/" class="demo-header__back">← Оглавление</a>
      </header>

      <div class="demo-site-bar">
        <div class="demo-site-bar__url">
          <span class="demo-site-bar__label">URL</span>
          <code id="demo-site-url" aria-live="polite"></code>
        </div>
        <nav class="demo-links demo-site-nav" aria-label="Сценарии update">
          <a href="/features/phase-update" aura-router-link>Обзор</a>
          <a href="/features/phase-update/search?tab=info" aura-router-link>Search</a>
          <a href="/features/phase-update/hash#one" aura-router-link>Hash</a>
          <a href="/features/phase-update/remount/1" aura-router-link>:id remount</a>
          <a href="/features/phase-update/update/1" aura-router-link>param-update</a>
        </nav>
      </div>

      <div class="demo-site-stage">
        <aura-router id="app" link-active-class="is-active" links-container-selector=".demo-site">
          <aura-outlet class="demo-site-outlet"></aura-outlet>

          <aura-route path="/features/phase-update/index.html" view="features/phase-update/intro.html"></aura-route>
          <aura-route path="/features/phase-update" view="features/phase-update/intro.html"></aura-route>

          <aura-route path="/features/phase-update/search" view="features/phase-update/search.html"></aura-route>
          <aura-route path="/features/phase-update/hash" view="features/phase-update/hash.html"></aura-route>

          <aura-route path="/features/phase-update/remount/:id" view="features/phase-update/user-{{id}}.html"></aura-route>
          <aura-route path="/features/phase-update/update/:id" view="features/phase-update/user-shell.html"></aura-route>
        </aura-router>
      </div>
    </div>
  </div>

  <script type="module" src="/src/examples/demo/main.ts"></script>
</body>
</html>
