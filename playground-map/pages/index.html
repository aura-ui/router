<html lang="ru">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Атлас Края — плоский мир сказочных зверей</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
    href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&family=Source+Serif+4:opsz,wght@8..60,400;8..60,600&display=swap"
    rel="stylesheet"
  />
  <link rel="stylesheet" href="./static/main.css" />
  <script src="./static/main.js" defer></script>
</head>
<body>
  <header class="site-header">
    <a class="brand" href="/" aura-router-link>
      Атлас Края
      <span>Плоский мир. Край изо льда. Звери между страницами.</span>
    </a>
    <nav class="top-nav">
      <a href="/" aura-router-link>Карта</a>
      <a href="/bestiary" aura-router-link>Книга зверей</a>
      <a href="/wall" aura-router-link>Стена</a>
      <a href="/about" aura-router-link>О мире</a>
    </nav>
  </header>

  <aside class="tour-rail" data-tour-rail hidden>
    <p class="tour-rail-label">Маршрут атласа</p>
    <ol class="tour-steps" data-tour-steps></ol>
    <a class="tour-next btn" data-tour-next href="/" aura-router-link>Дальше</a>
  </aside>

  <main class="shell">
    <aura-router
      link-active-class="active"
      load1ing-template="loading"
      loading-body-class="loading"
      error-template="error"
      cache-time="20000"
      cache
      prefetch="true"
    >
      <aura-route path="/" view="template::home-page"></aura-route>
      <aura-route path="/about" view="template::about-page"></aura-route>

      <aura-route
        path="/bestiary"
        view="bestiary"
        extract=".main"
        cache
      ></aura-route>
      <aura-route
        path="/bestiary/:id"
        view="bestiary/{{id}}"
        extract=".main"
      ></aura-route>

      <aura-route
        path="/regions/:regionId"
        layout="region-layout"
        ready="region-chrome"
        update="region-chrome"
      >
        <aura-route
          path="."
          view="regions/{{regionId}}"
          extract=".main"
        ></aura-route>
        <aura-route
          path="trails/:trailId"
          view="regions/{{regionId}}/trails/{{trailId}}"
          extract=".main"
        ></aura-route>
        <aura-route
          path="trails/:trailId/sights/:id"
          view="regions/{{regionId}}/trails/{{trailId}}/sights/{{id}}"
          extract=".main"
        ></aura-route>
        <aura-route
          path="journal"
          view="regions/{{regionId}}/journal"
          extract=".main"
          loading-template="loading-journal"
        ></aura-route>
      </aura-route>

      <aura-route path="/wall" view="wall" extract=".main"></aura-route>
      <aura-route
        path="/wall/gates/:gateId"
        view="wall/gates/{{gateId}}"
        extract=".main"
      ></aura-route>
      <aura-route
        path="/wall/beyond"
        view="wall/beyond"
        extract=".main"
        guard="journey"
      ></aura-route>

      <aura-route path="/start-journey" view="start-journey" extract=".main"></aura-route>
      <aura-route path="/seasons" view="seasons" extract=".main"></aura-route>

      <aura-route path="*" view="template::not-found"></aura-route>
    </aura-router>
  </main>

  <details class="dev-panel">
    <summary>Как устроен роутер на этой странице</summary>
    <p data-dev-note>Выберите маршрут — здесь появится короткая подсказка по фичам Aura.</p>
  </details>

  <template id="home-page">
    <section class="disk-hero scroll-mark">
      <h1 class="hero-title">Диск кончается льдом</h1>
      <p class="lede" style="margin-inline: auto">
        Внутри — леса, моря и звери, которых слышат чаще, чем видят.
        Атлас ведёт от Шепчущего Леса к Ледяной Стене — и ставит многоточие
        там, где кончаются карты.
      </p>

      <div class="disk-map" aria-label="Карта плоского мира">
        <span
          class="disk-sector is-soon"
          data-region="hearthlands"
          title="Ещё закрыто странникам"
        >Срединные<br />Земли<span class="soon-badge">закрыто</span></span>
        <a
          class="disk-sector is-start"
          data-region="whisperwood"
          href="/regions/whisperwood"
          aura-router-link
        >Шепчущий<br />Лес<span class="start-badge">начните здесь</span></a>
        <span
          class="disk-sector is-soon"
          data-region="sunsteppe"
          title="Ещё закрыто странникам"
        >Солнечная<br />Степь<span class="soon-badge">закрыто</span></span>
        <a
          class="disk-sector"
          data-region="mirrorsea"
          href="/regions/mirrorsea"
          aura-router-link
        >Зеркальное<br />Море</a>
        <a
          class="disk-sector"
          data-region="icewall"
          href="/regions/icewall"
          aura-router-link
        >У Стены<br /><span class="sector-note">тропы к воротам</span></a>
      </div>
      <p class="wall-ring-label">Белое кольцо — обод мира. Заставы и путь за край — в разделе «Стена».</p>
      <div class="map-cta actions" style="justify-content: center">
        <a class="btn" href="/regions/whisperwood" aura-router-link>Начать путь атласа</a>
        <a class="btn ghost" href="/bestiary" aura-router-link>Открыть Книгу зверей</a>
      </div>
    </section>
  </template>

  <template id="about-page">
    <article class="panel scroll-mark">
      <h1>Как устроен диск</h1>
      <p class="lede">
        Это сказка в духе старых карт: «здесь водятся драконы» —
        только добрее и с ободом изо льда. Земля здесь — круглый стол,
        а не шар, и край у него настоящий.
      </p>
      <ul class="about-list">
        <li><strong>Центр</strong> — Срединные Земли: поля, овины и знакомый свет.</li>
        <li><strong>Кольца</strong> — Шепчущий Лес, Зеркальное Море, степи странников.</li>
        <li><strong>Край</strong> — Ледяная Стена: заставы на ободе и тропы, что к ним ведут.</li>
      </ul>
      <p>
        Солнце ходит над столом. Карты кончаются у ворот Стены.
        За ними — гул, сияние и многоточие, которое атлас не заполняет.
      </p>
      <div class="actions">
        <a class="btn" href="/regions/whisperwood" aura-router-link>Начать путь</a>
        <a class="btn ghost" href="/seasons" aura-router-link>Сезоны света</a>
        <a class="btn ghost" href="/" aura-router-link>К карте</a>
      </div>
    </article>
  </template>

  <template id="region-layout">
    <section class="panel layout scroll-mark">
      <header class="region-chrome">
        <div>
          <nav class="breadcrumbs" data-region-crumbs aria-label="Путь"></nav>
          <p class="hint region-here" style="margin: 8px 0 4px">Вы в регионе</p>
          <h1 class="region-name">Путешествие</h1>
        </div>
        <nav class="subnav" data-region-subnav>
          <a data-nav="overview" href=".">Обзор</a>
          <a data-nav="journal" href="journal">Дневник</a>
        </nav>
      </header>
      <aura-outlet></aura-outlet>
    </section>
  </template>

  <template id="loading">
    <div class="panel loading-panel">
      <h1>Сказитель листает свиток…</h1>
      <p>Ищем нужный лист атласа</p>
    </div>
  </template>

  <template id="loading-journal">
    <div class="panel loading-panel">
      <h1>Открываем полевой дневник…</h1>
      <p>Чернила ещё сырые</p>
    </div>
  </template>

  <template id="error">
    <div class="panel error-panel">
      <h1>Свиток порвался</h1>
      <p>Не удалось загрузить страницу атласа.</p>
      <a class="btn" href="/" aura-router-link>На карту</a>
    </div>
  </template>

  <template id="not-found">
    <div class="panel not-found-panel">
      <h1>Край карты оборван</h1>
      <p>Такой зверь или тропа ещё не записаны в атласе.</p>
      <a class="btn" href="/" aura-router-link>Вернуться к диску</a>
    </div>
  </template>

</body>
</html>
