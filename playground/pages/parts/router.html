<aura-router link-active-class="active"
             loading-template="loading"
             loading-body-class="loading"
             error-template="error"
             extract=".main"
             prefetch="true"
             cache
             cache-time="15">
  <aura-route path="/"
              view="html::<h1>Index</h1><p>Server HTML pages подтягиваются роутом (url loader).</p>"></aura-route>
  <aura-route path="/about" view="template::about-page"></aura-route>
  <aura-route path="/login" view="login"></aura-route>

  <aura-route path="/contacts" view="contacts" cache="off"></aura-route>

  <aura-route path="/users/" layout="users" cache-time="10">
    <aura-route path="." view="users"></aura-route>
    <aura-route path=":id" view="users/{{id}}" ready="show-user"></aura-route>
  </aura-route>

  <aura-route path="/profile" layout="profile-layout" guard="auth">
    <aura-route path="." view="profile"></aura-route>
    <aura-route path="settings" view="profile/settings"></aura-route>
  </aura-route>

  <aura-route path="*" view="template::not-found"></aura-route>
</aura-router>

<template id="users">
  <section class="layout">
    <h2>Пользователи</h2>
    <p class="hint">layout остаётся при /users ↔ /users/:id</p>
    <aura-outlet></aura-outlet>
  </section>
</template>

<template id="profile-layout">
  <section class="layout">
    <h2>Profile</h2>
    <p class="hint">нужен login (guard="auth")</p>
    <div class="subnav">
      <a href="/profile" aura-router-link>Overview</a>
      <a href="/profile/settings" aura-router-link>Settings</a>
      <button type="button" data-demo-logout>Log out</button>
    </div>
    <aura-outlet></aura-outlet>
  </section>
</template>

<template id="about-page">
  <h1>About</h1>
  <p>Static markup из &lt;template&gt; — без сети.</p>
</template>

<template id="not-found">
  <h1>404</h1>
  <p>Маршрут не найден (path="*").</p>
  <p><a href="/" aura-router-link>Home</a></p>
</template>

<template id="loading">
  <h1>Loading…</h1>
</template>

<template id="error">
  <h1>Error</h1>
</template>
