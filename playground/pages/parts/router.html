<aura-router link-active-class="active"
             loading-templa1te="loading"
             loading-body-class="loading"
             error-template="error"
             cache-time="15000"
             cache
             extract=".main"
             prefetch="true">
  <aura-route path="/" view="html::<h1>Index</h1><p>Server HTML pages подтягиваются роутом (url loader).</p>"></aura-route>
  <aura-route path="/about" view="template::about-page"></aura-route>
  <aura-route path="/login" view="login"></aura-route>

  <aura-route path="/contacts"
              view="contacts"
              extract=".main"
              cache="off"
              loading-template="loading-contacts"></aura-route>

  <aura-route path="/user" layout="users" cache cache-time="10000">
    <aura-route path="." view="users" extract=".main"></aura-route>
    <aura-route path=":id"
                view="user/{{id}}"
                extract=".main"
                ready="show-user"
                update="show-user">
    </aura-route>
  </aura-route>

  <aura-route path="/profile" layout="profile-layout" guard="auth">
    <aura-route path="." view="profile" extract=".main"></aura-route>
    <aura-route path="settings" view="profile/settings" extract=".main"></aura-route>
  </aura-route>

  <aura-route path="*" view="template::not-found"></aura-route>
</aura-router>

<template id="users">
  <section class="layout">
    <h2>Пользователи</h2>
    <p class="hint">layout остаётся смонтированным при смене /user ↔ /user/:id</p>
    <aura-outlet></aura-outlet>
  </section>
</template>

<template id="profile-layout">
  <section class="layout">
    <h2>Profile area</h2>
    <p class="hint">доступ только после login (guard="auth")</p>
    <div class="subnav">
      <a href="/profile" aura-router-link>Overview</a>
      <a href="/profile/settings" aura-router-link>Settings</a>
      <button type="button" data-demo-logout>Log out</button>
    </div>
    <aura-outlet></aura-outlet>
  </section>
</template>

<template id="about-page">
  <h1>About</h1>
  <p>Static markup из &lt;template&gt; — без сети.</p>
</template>

<template id="not-found">
  <h1>404</h1>
  <p>Маршрут не найден (path="*").</p>
</template>

<template id="loading">
  <h1>Loading…</h1>
</template>

<template id="loading-contacts">
  <h1>Loading contacts…</h1>
</template>

<template id="error">
  <h1>!!!Error</h1>
</template>
